version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khmer_math_lab_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Khmer Math Lab API
      - APP_VERSION=0.1.0
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:////app/data/khmer_math_lab.db
      - VISION_PROVIDER=stub
      - CORS_ORIGINS=["*"]
    volumes:
      - math_lab_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  math_lab_data:
    driver: local
