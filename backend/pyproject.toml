[project]
name = "khmer-math-lab-backend"
version = "0.1.0"
description = "Backend + AI system for Khmer Math Lab: understands Khmer math language, solves it deterministically, explains it in Khmer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sympy>=1.13",
    "latex2sympy2>=1.9.1",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "pix2tex>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:antlr4.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::UserWarning:albumentations.*",
    "ignore::UserWarning:pydantic.*",
    "ignore::FutureWarning:torch.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "W293", # blank line contains whitespace
    "E741", # ambiguous variable name
    "UP042", # str, Enum inheritance
    "B904", # raise ... from err
    "F841", # local variable assigned but never used
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", "\\.venv", "tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/ocr/extraction/gemini_vision.py",
    "app/ocr/extraction/google_vision.py",
    "app/ocr/extraction/mathpix.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
